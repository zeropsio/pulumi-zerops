name: Fork PR probe
on: pull_request
permissions:
  contents: read
jobs:
  reach-runner-with-secrets:
    runs-on: [self-hosted, linux, x64, zerops-ranpu]
    environment: ranpu-live
    steps:
      - run: echo "reached the self-hosted runner; secret length ${#ZEROPS_TOKEN}"
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
